  <line x1="180" y1="200" x2="220" y2="200" stroke="#18C5DD" stroke-width="1.5" opacity="0.6"/>
  <polygon points="220,195 230,200 220,205" fill="#18C5DD" opacity="0.6"/>
  <rect x="230" y="175" width="120" height="50" rx="8" fill="none" stroke="#0072ff" stroke-width="1.5" opacity="0.8"/>
  <text x="290" y="205" text-anchor="middle" fill="#7eb8ff" font-size="12" font-family="monospace">Whisper</text>
  <line x1="350" y1="200" x2="390" y2="200" stroke="#18C5DD" stroke-width="1.5" opacity="0.6"/>
  <polygon points="390,195 400,200 390,205" fill="#18C5DD" opacity="0.6"/>
  <rect x="400" y="175" width="120" height="50" rx="8" fill="none" stroke="#00c6ff" stroke-width="1.5" opacity="0.8"/>
  <text x="460" y="205" text-anchor="middle" fill="#7eb8ff" font-size="12" font-family="monospace">NLP</text>
  <line x1="520" y1="200" x2="560" y2="200" stroke="#18C5DD" stroke-width="1.5" opacity="0.6"/>
  <polygon points="560,195 570,200 560,205" fill="#18C5DD" opacity="0.6"/>
  <rect x="570" y="175" width="130" height="50" rx="8" fill="none" stroke="#18C5DD" stroke-width="1.5" opacity="0.8"/>
  <text x="635" y="205" text-anchor="middle" fill="#18C5DD" font-size="12" font-family="monospace">Insights</text>
  <!-- Waveform -->
  <polyline points="60,290 80,270 100,310 120,280 140,300 160,265 180,295 200,275 220,305 240,285 260,290" fill="none" stroke="#18C5DD" stroke-width="2" opacity="0.4"/>
  <!-- Labels -->
  <rect x="0" y="390" width="800" height="60" fill="#0a0f1e" opacity="0.7"/>
  <text x="40" y="422" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">AI Pipeline Container</text>
  <text x="40" y="442" fill="#18C5DD" font-size="12" font-family="sans-serif">FastAPI · Celery · Redis · Docker · Whisper · spaCy</text>
  <rect x="670" y="400" width="90" height="24" rx="4" fill="#18C5DD" opacity="0.2"/>
  <text x="715" y="416" text-anchor="middle" fill="#18C5DD" font-size="11" font-family="sans-serif">Production</text>
