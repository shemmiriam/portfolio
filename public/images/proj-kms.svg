<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#0d2b1f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Document stack visuals -->
  <rect x="80" y="120" width="160" height="200" rx="6" fill="#0d2b1f" stroke="#34d399" stroke-width="1" opacity="0.9"/>
  <rect x="90" y="110" width="160" height="200" rx="6" fill="#0d2b1f" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <rect x="100" y="100" width="160" height="200" rx="6" fill="#112a1e" stroke="#34d399" stroke-width="1.5"/>
  <line x1="120" y1="135" x2="240" y2="135" stroke="#34d399" stroke-width="1" opacity="0.5"/>
  <line x1="120" y1="155" x2="220" y2="155" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="175" x2="230" y2="175" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="195" x2="210" y2="195" stroke="#34d399" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="215" x2="225" y2="215" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  <line x1="120" y1="235" x2="215" y2="235" stroke="#34d399" stroke-width="1" opacity="0.3"/>
  <!-- AI search bar -->
  <rect x="310" y="150" width="300" height="44" rx="22" fill="#0d2b1f" stroke="#34d399" stroke-width="1.5"/>
  <text x="340" y="178" fill="#34d399" font-size="13" font-family="monospace" opacity="0.7">Search knowledge base...</text>
  <!-- Result cards -->
  <rect x="310" y="215" width="290" height="50" rx="6" fill="#112a1e" stroke="#34d399" stroke-width="1" opacity="0.8"/>
  <text x="325" y="237" fill="#34d399" font-size="12" font-family="sans-serif">Policy Document — Energy Regulation</text>
  <text x="325" y="254" fill="#34d399" font-size="10" font-family="sans-serif" opacity="0.6">Relevance: 97% · 2 mins ago</text>
  <rect x="310" y="275" width="290" height="50" rx="6" fill="#112a1e" stroke="#34d399" stroke-width="1" opacity="0.6"/>
  <text x="325" y="297" fill="#34d399" font-size="12" font-family="sans-serif">Technical Report Q3 2025</text>
  <text x="325" y="314" fill="#34d399" font-size="10" font-family="sans-serif" opacity="0.5">Relevance: 91%</text>
  <!-- Arrow -->
  <line x1="260" y1="210" x2="305" y2="175" stroke="#34d399" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Footer -->
  <rect x="0" y="390" width="800" height="60" fill="#0a1628" opacity="0.8"/>
  <text x="40" y="422" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">AI-Powered Knowledge Management System</text>
  <text x="40" y="442" fill="#34d399" font-size="12" font-family="sans-serif">Python · FastAPI · PostgreSQL · Docker · AI Search</text>
  <rect x="670" y="400" width="90" height="24" rx="4" fill="#34d399" opacity="0.2"/>
  <text x="715" y="416" text-anchor="middle" fill="#34d399" font-size="11" font-family="sans-serif">Production</text>
</svg>
