<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-cpims" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1409"/>
      <stop offset="100%" style="stop-color:#111e10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-cpims)"/>
  <!-- Migration arrow: old → new -->
  <!-- Old stack box -->
  <rect x="60" y="130" width="210" height="160" rx="10" fill="#0e1f0c" stroke="#f87171" stroke-width="1.5" opacity="0.85"/>
  <text x="165" y="158" text-anchor="middle" fill="#f87171" font-size="13" font-weight="bold" font-family="monospace">Legacy</text>
  <text x="165" y="180" text-anchor="middle" fill="#f87171" font-size="24" font-weight="bold" font-family="monospace">2.7</text>
  <text x="165" y="200" text-anchor="middle" fill="#f87171" font-size="11" font-family="sans-serif" opacity="0.7">Python 2.7</text>
  <line x1="80" y1="220" x2="250" y2="220" stroke="#f87171" stroke-width="1" opacity="0.2"/>
  <text x="165" y="243" text-anchor="middle" fill="#f87171" font-size="11" font-family="monospace">Django 1.8</text>
  <text x="165" y="265" text-anchor="middle" fill="#f87171" font-size="9" font-family="sans-serif" opacity="0.55">CPIMS OVC Registry</text>
  <text x="165" y="280" text-anchor="middle" fill="#f87171" font-size="9" font-family="sans-serif" opacity="0.45">Kenya National</text>
  <!-- Arrow -->
  <line x1="285" y1="210" x2="515" y2="210" stroke="#4ade80" stroke-width="2.5" opacity="0.7"/>
  <polygon points="515,202 535,210 515,218" fill="#4ade80" opacity="0.8"/>
  <text x="400" y="198" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif" font-weight="bold">Migration</text>
  <text x="400" y="230" text-anchor="middle" fill="#4ade80" font-size="9" font-family="sans-serif" opacity="0.65">14 months · careful</text>
  <!-- New stack box -->
  <rect x="540" y="130" width="210" height="160" rx="10" fill="#0e1f0c" stroke="#4ade80" stroke-width="2" opacity="0.9"/>
  <text x="645" y="158" text-anchor="middle" fill="#4ade80" font-size="13" font-weight="bold" font-family="monospace">Modern</text>
  <text x="645" y="180" text-anchor="middle" fill="#4ade80" font-size="24" font-weight="bold" font-family="monospace">3.10</text>
  <text x="645" y="200" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif" opacity="0.8">Python 3.10</text>
  <line x1="560" y1="220" x2="730" y2="220" stroke="#4ade80" stroke-width="1" opacity="0.2"/>
  <text x="645" y="243" text-anchor="middle" fill="#4ade80" font-size="11" font-family="monospace">Django 4.0.2</text>
  <text x="645" y="265" text-anchor="middle" fill="#4ade80" font-size="9" font-family="sans-serif" opacity="0.7">CPIMS OVC Registry</text>
  <text x="645" y="280" text-anchor="middle" fill="#4ade80" font-size="9" font-family="sans-serif" opacity="0.55">Kenya National</text>
  <!-- Bottom impact tags -->
  <rect x="150" y="330" width="120" height="26" rx="5" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="1"/>
  <text x="210" y="347" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif">Security Patches</text>
  <rect x="285" y="330" width="130" height="26" rx="5" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="1"/>
  <text x="350" y="347" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif">Modern ORM APIs</text>
  <rect x="430" y="330" width="130" height="26" rx="5" fill="rgba(74,222,128,0.1)" stroke="#4ade80" stroke-width="1"/>
  <text x="495" y="347" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif">LTS Support</text>
  <!-- Footer -->
  <rect x="0" y="390" width="800" height="60" fill="#080f07" opacity="0.96"/>
  <text x="40" y="418" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">CPIMS OVC 3.0: Django &amp; Python Upgrade</text>
  <text x="40" y="440" fill="#4ade80" font-size="12" font-family="sans-serif">Python 2.7→3.10 · Django 1.8→4.0 · Kenya National Child Protection Registry</text>
  <rect x="650" y="400" width="105" height="24" rx="4" fill="#4ade80" opacity="0.15"/>
  <text x="702" y="416" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif">Completed</text>
</svg>
