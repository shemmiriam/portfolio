<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-integration" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e"/>
      <stop offset="100%" style="stop-color:#101828"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-integration)"/>
  <!-- OpenCHS core node -->
  <rect x="55" y="165" width="150" height="75" rx="8" fill="#0d1f3c" stroke="#38bdf8" stroke-width="2"/>
  <text x="130" y="197" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold" font-family="sans-serif">OpenCHS</text>
  <text x="130" y="215" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="sans-serif" opacity="0.65">Case Management</text>
  <text x="130" y="231" text-anchor="middle" fill="#38bdf8" font-size="9" font-family="sans-serif" opacity="0.5">Django · REST APIs</text>
  <!-- Uganda MGLSD -->
  <rect x="590" y="80" width="155" height="72" rx="8" fill="#0d1f3c" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="667" y="110" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold" font-family="sans-serif">Uganda MGLSD</text>
  <text x="667" y="128" text-anchor="middle" fill="#60a5fa" font-size="10" font-family="sans-serif" opacity="0.6">Child Protection</text>
  <text x="667" y="144" text-anchor="middle" fill="#60a5fa" font-size="9" font-family="sans-serif" opacity="0.45">Gov Gateway</text>
  <!-- Kenya CPIMS -->
  <rect x="590" y="195" width="155" height="72" rx="8" fill="#0d1f3c" stroke="#818cf8" stroke-width="1.5"/>
  <text x="667" y="225" text-anchor="middle" fill="#818cf8" font-size="12" font-weight="bold" font-family="sans-serif">Kenya CPIMS</text>
  <text x="667" y="243" text-anchor="middle" fill="#818cf8" font-size="10" font-family="sans-serif" opacity="0.6">OVC Registry</text>
  <text x="667" y="259" text-anchor="middle" fill="#818cf8" font-size="9" font-family="sans-serif" opacity="0.45">REST · JWT · SSL</text>
  <!-- WhatsApp / SMS -->
  <rect x="590" y="310" width="155" height="65" rx="8" fill="#0d1f3c" stroke="#34d399" stroke-width="1.5"/>
  <text x="667" y="337" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold" font-family="sans-serif">WhatsApp / SMS</text>
  <text x="667" y="355" text-anchor="middle" fill="#34d399" font-size="10" font-family="sans-serif" opacity="0.6">Helpline Channels</text>
  <text x="667" y="368" text-anchor="middle" fill="#34d399" font-size="9" font-family="sans-serif" opacity="0.45">Twilio · Africa's Talking</text>
  <!-- Central API hub -->
  <circle cx="390" cy="220" r="60" fill="#0b1a33" stroke="#38bdf8" stroke-width="2"/>
  <text x="390" y="210" text-anchor="middle" fill="#38bdf8" font-size="14" font-weight="bold" font-family="monospace">REST API</text>
  <text x="390" y="229" text-anchor="middle" fill="#60a5fa" font-size="10" font-family="monospace">OAuth2 · JWT</text>
  <text x="390" y="246" text-anchor="middle" fill="#818cf8" font-size="9" font-family="monospace" opacity="0.7">SSL/TLS</text>
  <!-- Connection lines -->
  <line x1="205" y1="202" x2="330" y2="212" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.55"/>
  <line x1="450" y1="188" x2="590" y2="116" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.55"/>
  <line x1="450" y1="224" x2="590" y2="231" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.55"/>
  <line x1="450" y1="248" x2="590" y2="342" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.5"/>
  <!-- Footer -->
  <rect x="0" y="390" width="800" height="60" fill="#070c18" opacity="0.96"/>
  <text x="40" y="418" fill="white" font-size="17" font-weight="bold" font-family="sans-serif">Government &amp; Institutional API Integrations</text>
  <text x="40" y="440" fill="#38bdf8" font-size="12" font-family="sans-serif">Django · OAuth2 · JWT · SSL/TLS · Uganda MGLSD · Kenya CPIMS</text>
  <rect x="670" y="400" width="90" height="24" rx="4" fill="#38bdf8" opacity="0.18"/>
  <text x="715" y="416" text-anchor="middle" fill="#38bdf8" font-size="11" font-family="sans-serif">Production</text>
</svg>
