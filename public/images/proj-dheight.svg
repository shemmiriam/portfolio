<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071209"/>
      <stop offset="100%" style="stop-color:#0e1f10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Concentric circles -->
  <circle cx="400" cy="200" r="165" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.12"/>
  <circle cx="400" cy="200" r="125" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.18"/>
  <circle cx="400" cy="200" r="85" fill="none" stroke="#4ade80" stroke-width="1.5" opacity="0.28"/>
  <circle cx="400" cy="200" r="44" fill="#0e2a10" stroke="#4ade80" stroke-width="2" opacity="0.95"/>
  <text x="400" y="196" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="bold" font-family="sans-serif">DPI</text>
  <text x="400" y="210" text-anchor="middle" fill="#4ade80" font-size="8" font-family="sans-serif">Initiative</text>
  <!-- D-pillars around the wheel -->
  <!-- D-HEIGHT top -->
  <text x="400" y="98" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">D-HEIGHT</text>
  <text x="400" y="112" text-anchor="middle" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">Housing</text>
  <!-- D-Learn top-right -->
  <text x="535" y="138" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">D-Learn</text>
  <text x="535" y="152" text-anchor="middle" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">Education</text>
  <!-- D-Health right -->
  <text x="578" y="208" text-anchor="start" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">D-Health</text>
  <text x="578" y="222" text-anchor="start" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">Healthcare</text>
  <!-- D-Social bottom-right -->
  <text x="530" y="272" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">D-Social</text>
  <text x="530" y="286" text-anchor="middle" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">Social Services</text>
  <!-- Finance bottom-left -->
  <text x="268" y="272" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">D-Finance</text>
  <text x="268" y="286" text-anchor="middle" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">Inclusion</text>
  <!-- D-Gov left -->
  <text x="180" y="208" text-anchor="end" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">D-Gov</text>
  <text x="180" y="222" text-anchor="end" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">Governance</text>
  <!-- AI top-left -->
  <text x="265" y="138" text-anchor="middle" fill="#86efac" font-size="12" font-weight="bold" font-family="sans-serif">Responsible</text>
  <text x="265" y="152" text-anchor="middle" fill="#86efac" font-size="9" font-family="sans-serif" opacity="0.7">AI Layer</text>
  <!-- Spokes -->
  <line x1="400" y1="156" x2="400" y2="118" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="430" y1="168" x2="510" y2="138" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="444" y1="200" x2="572" y2="208" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="430" y1="232" x2="505" y2="263" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="370" y1="232" x2="295" y2="263" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="356" y1="200" x2="190" y2="208" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <line x1="370" y1="168" x2="292" y2="138" stroke="#4ade80" stroke-width="1" opacity="0.35"/>
  <!-- Footer -->
  <rect x="0" y="390" width="800" height="60" fill="#071209" opacity="0.92"/>
  <text x="40" y="420" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">Digital Public Infrastructure Initiative</text>
  <text x="40" y="441" fill="#4ade80" font-size="12" font-family="sans-serif">D-HEIGHT · D-Learn · D-Health · D-Social · D-Finance · D-Gov · Responsible AI</text>
  <rect x="630" y="400" width="130" height="24" rx="4" fill="#4ade80" opacity="0.15"/>
  <text x="695" y="416" text-anchor="middle" fill="#4ade80" font-size="11" font-family="sans-serif">Research &amp; Design</text>
</svg>
