      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#131326"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-isp)"/>
  <!-- Network tower -->
  <line x1="400" y1="55" x2="372" y2="165" stroke="#a78bfa" stroke-width="2.5" opacity="0.9"/>
  <line x1="400" y1="55" x2="428" y2="165" stroke="#a78bfa" stroke-width="2.5" opacity="0.9"/>
  <line x1="372" y1="165" x2="428" y2="165" stroke="#a78bfa" stroke-width="2" opacity="0.9"/>
  <line x1="400" y1="55" x2="400" y2="165" stroke="#a78bfa" stroke-width="1.5" opacity="0.45"/>
  <!-- Signal arcs -->
  <path d="M348 88 Q400 36 452 88" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.6"/>
  <path d="M320 112 Q400 36 480 112" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.35"/>
