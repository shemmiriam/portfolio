  <rect x="428" y="320" width="105" height="26" rx="5" fill="rgba(167,139,250,0.12)" stroke="#a78bfa" stroke-width="1"/>
  <text x="480" y="337" text-anchor="middle" fill="#c4b5fd" font-size="12" font-family="sans-serif">TypeScript</text>
