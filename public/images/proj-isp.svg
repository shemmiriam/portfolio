  <line x1="400" y1="165" x2="287" y2="210" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="165" x2="512" y2="210" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
  <line x1="400" y1="165" x2="672" y2="210" stroke="#a78bfa" stroke-width="1" opacity="0.3"/>
