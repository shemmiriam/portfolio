  <text x="512" y="260" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="sans-serif">Billing Cycles</text>
  <text x="512" y="275" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="sans-serif" opacity="0.55">Auto-generate</text>
  <rect x="605" y="210" width="135" height="72" rx="8" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="672" y="242" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="bold" font-family="sans-serif">Monitoring</text>
  <text x="672" y="260" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="sans-serif">Network Health</text>
  <text x="672" y="275" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="sans-serif" opacity="0.55">Uptime · Alerts</text>
