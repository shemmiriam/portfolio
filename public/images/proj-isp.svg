  <text x="127" y="275" text-anchor="middle" fill="#a78bfa" font-size="9" font-family="sans-serif" opacity="0.55">Plans · Billing</text>
  <rect x="220" y="210" width="135" height="72" rx="8" fill="rgba(167,139,250,0.08)" stroke="#a78bfa" stroke-width="1.5"/>
