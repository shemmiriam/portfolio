  <rect x="0" y="390" width="800" height="60" fill="#09091a" opacity="0.96"/>
  <text x="40" y="418" fill="white" font-size="18" font-weight="bold" font-family="sans-serif">ISP Management System</text>
  <text x="40" y="440" fill="#a78bfa" font-size="12" font-family="sans-serif">Django · Python · Next.js · TypeScript · REST APIs</text>
  <rect x="640" y="400" width="120" height="24" rx="4" fill="#a78bfa" opacity="0.18"/>
  <text x="700" y="416" text-anchor="middle" fill="#a78bfa" font-size="11" font-family="sans-serif">In Development</text>
